<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="s3_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF4EB"/>
      <stop offset="60%" stop-color="#F8EFE4"/>
      <stop offset="100%" stop-color="#F0E5D8"/>
    </linearGradient>
    <pattern id="s3_grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#E7D8CE" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
    <filter id="s3_cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#332426" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#s3_bg)"/>
  <rect width="1920" height="1080" fill="url(#s3_grid)"/>

  <!-- Top Header Ribbon -->
  <g transform="translate(100, 70)">
    <rect width="44" height="44" rx="12" fill="#873B46"/>
    <path d="M 22 14 L 12 20 L 22 26 L 32 20 Z M 16 23 L 16 28 C 16 30 28 30 28 28 L 28 23" fill="none" stroke="#FFFCF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="56" y="22" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#873B46" letter-spacing="2">
      PROBLEM STATEMENT
    </text>
    <text x="56" y="44" font-family="'Manrope', sans-serif" font-size="34" font-weight="900" fill="#332426" letter-spacing="-0.5">
      The Real Problems Students Face in Individual &amp; Group Study
    </text>

    <rect x="1560" y="5" width="160" height="36" rx="18" fill="#F4E2E3" stroke="#E7D8CE" stroke-width="1"/>
    <text x="1640" y="28" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#873B46">
      THE PROBLEM
    </text>
  </g>

  <line x1="100" y1="155" x2="1820" y2="155" stroke="#E7D8CE" stroke-width="1.5"/>

  <!-- 2 Columns: Individual Study Problems vs Group Study Problems -->
  <g transform="translate(100, 190)">
    <!-- Column 1: Individual Study Roadblocks -->
    <g transform="translate(0, 0)">
      <rect width="830" height="760" rx="24" fill="#FFF8F8" stroke="#EAD2D4" stroke-width="1.5" filter="url(#s3_cardShadow)"/>
      <rect x="40" y="35" width="56" height="56" rx="18" fill="#F4E2E3" stroke="#873B46" stroke-width="1.5"/>
      <text x="68" y="70" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="22" font-weight="900" fill="#873B46">👤</text>

      <text x="110" y="55" font-family="'Manrope', sans-serif" font-size="24" font-weight="800" fill="#332426">Individual Study Challenges</text>
      <text x="110" y="80" font-family="'Manrope', sans-serif" font-size="14" font-weight="600" fill="#873B46">Passive Effort, Roadblocks &amp; Fake Productivity</text>
      <line x1="40" y1="110" x2="790" y2="110" stroke="#EAD2D4" stroke-width="1.2"/>

      <!-- Point 1 -->
      <g transform="translate(40, 135)">
        <rect width="750" height="125" rx="16" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1"/>
        <circle cx="35" cy="35" r="16" fill="#F4E2E3" stroke="#873B46" stroke-width="2"/>
        <text x="35" y="42" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="16" font-weight="900" fill="#873B46">✕</text>
        <text x="65" y="32" font-family="'Manrope', sans-serif" font-size="18" font-weight="800" fill="#332426">Passive "Clock-Watching" Timers</text>
        <text x="65" y="58" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">Students run Pomodoro timers while multitasking. Elapsed seconds do not guarantee that concepts were learned or problems solved.</text>
        <text x="65" y="90" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#873B46">Result: Illusion of productivity without actual academic retention.</text>
      </g>

      <!-- Point 2 -->
      <g transform="translate(40, 280)">
        <rect width="750" height="125" rx="16" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1"/>
        <circle cx="35" cy="35" r="16" fill="#F4E2E3" stroke="#873B46" stroke-width="2"/>
        <text x="35" y="42" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="16" font-weight="900" fill="#873B46">✕</text>
        <text x="65" y="32" font-family="'Manrope', sans-serif" font-size="18" font-weight="800" fill="#332426">Forgotten Conceptual Roadblocks</text>
        <text x="65" y="58" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">When students hit difficult derivations or tricky code errors, they abandon the session. Roadblocks are never systematically recorded.</text>
        <text x="65" y="90" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#873B46">Result: Same doubts repeat during exam preparation.</text>
      </g>

      <!-- Point 3 -->
      <g transform="translate(40, 425)">
        <rect width="750" height="125" rx="16" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1"/>
        <circle cx="35" cy="35" r="16" fill="#F4E2E3" stroke="#873B46" stroke-width="2"/>
        <text x="35" y="42" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="16" font-weight="900" fill="#873B46">✕</text>
        <text x="65" y="32" font-family="'Manrope', sans-serif" font-size="18" font-weight="800" fill="#332426">Easily Exploited Gamification</text>
        <text x="65" y="58" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">Standard streak apps reward users simply for opening the app. Points can be auto-farmed without true effort.</text>
        <text x="65" y="90" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#873B46">Result: Superficial badges that demotivate serious learners.</text>
      </g>

      <!-- Point 4 -->
      <g transform="translate(40, 570)">
        <rect width="750" height="125" rx="16" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1"/>
        <circle cx="35" cy="35" r="16" fill="#F4E2E3" stroke="#873B46" stroke-width="2"/>
        <text x="35" y="42" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="16" font-weight="900" fill="#873B46">✕</text>
        <text x="65" y="32" font-family="'Manrope', sans-serif" font-size="18" font-weight="800" fill="#332426">No Objective Proof of Completion</text>
        <text x="65" y="58" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">No mechanism checks whether the student fulfilled specific learning goals before marking a study session complete.</text>
        <text x="65" y="90" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#873B46">Result: Inability to accurately assess personal study velocity.</text>
      </g>
    </g>

    <!-- Column 2: Group Study & Peer Collaboration Problems -->
    <g transform="translate(890, 0)">
      <rect width="830" height="760" rx="24" fill="#FFF8F8" stroke="#EAD2D4" stroke-width="1.5" filter="url(#s3_cardShadow)"/>
      <rect x="40" y="35" width="56" height="56" rx="18" fill="#F4E2E3" stroke="#873B46" stroke-width="1.5"/>
      <text x="68" y="70" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="22" font-weight="900" fill="#873B46">👥</text>

      <text x="110" y="55" font-family="'Manrope', sans-serif" font-size="24" font-weight="800" fill="#332426">Group Study &amp; Peer Bottlenecks</text>
      <text x="110" y="80" font-family="'Manrope', sans-serif" font-size="14" font-weight="600" fill="#873B46">Unstructured Social Streams &amp; Terminal Submissions</text>
      <line x1="40" y1="110" x2="790" y2="110" stroke="#EAD2D4" stroke-width="1.2"/>

      <!-- Point 1 -->
      <g transform="translate(40, 135)">
        <rect width="750" height="125" rx="16" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1"/>
        <circle cx="35" cy="35" r="16" fill="#F4E2E3" stroke="#873B46" stroke-width="2"/>
        <text x="35" y="42" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="16" font-weight="900" fill="#873B46">✕</text>
        <text x="65" y="32" font-family="'Manrope', sans-serif" font-size="18" font-weight="800" fill="#332426">Chat Stream Overload &amp; Lost Deadlines</text>
        <text x="65" y="58" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">General apps (WhatsApp/Discord) mix casual social chatter with coursework. Assignments, files, and deadlines quickly drown in hundreds of messages.</text>
        <text x="65" y="90" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#873B46">Result: Missed tasks and chaotic group organization.</text>
      </g>

      <!-- Point 2 -->
      <g transform="translate(40, 280)">
        <rect width="750" height="125" rx="16" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1"/>
        <circle cx="35" cy="35" r="16" fill="#F4E2E3" stroke="#873B46" stroke-width="2"/>
        <text x="35" y="42" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="16" font-weight="900" fill="#873B46">✕</text>
        <text x="65" y="32" font-family="'Manrope', sans-serif" font-size="18" font-weight="800" fill="#332426">Single-Shot "Terminal" Submissions</text>
        <text x="65" y="58" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">Students upload coursework once, get an arbitrary mark, and never iterate on mistakes. There is no versioning system (v1 → v2) to submit corrections.</text>
        <text x="65" y="90" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#873B46">Result: Zero learning from errors; no growth mindset.</text>
      </g>

      <!-- Point 3 -->
      <g transform="translate(40, 425)">
        <rect width="750" height="125" rx="16" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1"/>
        <circle cx="35" cy="35" r="16" fill="#F4E2E3" stroke="#873B46" stroke-width="2"/>
        <text x="35" y="42" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="16" font-weight="900" fill="#873B46">✕</text>
        <text x="65" y="32" font-family="'Manrope', sans-serif" font-size="18" font-weight="800" fill="#332426">Vague &amp; Unconstructive Feedback</text>
        <text x="65" y="58" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">Feedback lacks explicit rubric criteria. Students don't know why marks were deducted or which derivation step was incomplete.</text>
        <text x="65" y="90" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#873B46">Result: Subjective evaluations and frustrated students.</text>
      </g>

      <!-- Point 4 -->
      <g transform="translate(40, 570)">
        <rect width="750" height="125" rx="16" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1"/>
        <circle cx="35" cy="35" r="16" fill="#F4E2E3" stroke="#873B46" stroke-width="2"/>
        <text x="35" y="42" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="16" font-weight="900" fill="#873B46">✕</text>
        <text x="65" y="32" font-family="'Manrope', sans-serif" font-size="18" font-weight="800" fill="#332426">High Friction in Academic Doubt Sharing</text>
        <text x="65" y="58" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">Students struggle to share whiteboard or notebook diagrams. Helpful peer answers are buried with no way to mark the accepted solution.</text>
        <text x="65" y="90" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#873B46">Result: Peers lack incentives to provide high-quality answers.</text>
      </g>
    </g>
  </g>

  <!-- Slide Footer -->
  <g transform="translate(100, 990)">
    <line x1="0" y1="0" x2="1720" y2="0" stroke="#E7D8CE" stroke-width="1"/>
    <text x="0" y="32" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#78666A">
      CONSTA PLATFORM • PROBLEM STATEMENT
    </text>
    <text x="1720" y="32" text-anchor="end" font-family="'Manrope', sans-serif" font-size="13" font-weight="800" fill="#873B46">
      SLIDE 03 / 14
    </text>
  </g>
</svg>
