<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="s5_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF4EB"/>
      <stop offset="60%" stop-color="#F8EFE4"/>
      <stop offset="100%" stop-color="#F0E5D8"/>
    </linearGradient>
    <pattern id="s5_grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#E7D8CE" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
    <filter id="s5_cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#332426" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#s5_bg)"/>
  <rect width="1920" height="1080" fill="url(#s5_grid)"/>

  <!-- Top Header Ribbon -->
  <g transform="translate(100, 70)">
    <rect width="44" height="44" rx="12" fill="#873B46"/>
    <path d="M 22 14 L 12 20 L 22 26 L 32 20 Z M 16 23 L 16 28 C 16 30 28 30 28 28 L 28 23" fill="none" stroke="#FFFCF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="56" y="22" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#873B46" letter-spacing="2">
      PROJECT OBJECTIVES &amp; DELIVERABLES
    </text>
    <text x="56" y="44" font-family="'Manrope', sans-serif" font-size="34" font-weight="900" fill="#332426" letter-spacing="-0.5">
      Key Project Goals &amp; Expected Academic Outcomes
    </text>

    <rect x="1560" y="5" width="160" height="36" rx="18" fill="#F4E2E3" stroke="#E7D8CE" stroke-width="1"/>
    <text x="1640" y="28" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#873B46">
      OBJECTIVES
    </text>
  </g>

  <line x1="100" y1="155" x2="1820" y2="155" stroke="#E7D8CE" stroke-width="1.5"/>

  <!-- 6 Strategic Objectives Cards (2 Columns x 3 Rows) -->
  <g transform="translate(100, 190)">
    <!-- Objective 1 -->
    <g transform="translate(0, 0)">
      <rect width="830" height="235" rx="22" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1.5" filter="url(#s5_cardShadow)"/>
      <circle cx="50" cy="50" r="22" fill="#873B46"/>
      <text x="50" y="58" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="18" font-weight="900" fill="#FFFCF7">01</text>
      
      <text x="95" y="48" font-family="'Manrope', sans-serif" font-size="20" font-weight="800" fill="#332426">Outcome-Driven Individual Study Focus</text>
      <text x="95" y="72" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#873B46">Goal: Transform passive timer-watching into verified milestone completion.</text>
      <line x1="30" y1="95" x2="795" y2="95" stroke="#F0E5D8" stroke-width="1.2"/>

      <text x="30" y="130" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">
        • Require students to check off explicit learning objectives and log difficult concepts before earning verified study XP.
      </text>
      <text x="30" y="160" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">
        • Integrated Roadblock Logger ensures confusing topics are systematically flagged for peer review or AI explanations.
      </text>
      <text x="30" y="195" font-family="'Manrope', sans-serif" font-size="13" font-weight="800" fill="#873B46">Expected Outcome: Higher study focus and elimination of passive clock-watching.</text>
    </g>

    <!-- Objective 2 -->
    <g transform="translate(890, 0)">
      <rect width="830" height="235" rx="22" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1.5" filter="url(#s5_cardShadow)"/>
      <circle cx="50" cy="50" r="22" fill="#873B46"/>
      <text x="50" y="58" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="18" font-weight="900" fill="#FFFCF7">02</text>
      
      <text x="95" y="48" font-family="'Manrope', sans-serif" font-size="20" font-weight="800" fill="#332426">Structured Cohort Governance &amp; Admin Roles</text>
      <text x="95" y="72" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#873B46">Goal: Provide organized, distraction-free study room workspaces.</text>
      <line x1="30" y1="95" x2="795" y2="95" stroke="#F0E5D8" stroke-width="1.2"/>

      <text x="30" y="130" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">
        • Automatically designate the group creator as the Admin to assign tasks, set countdown timers, and manage members.
      </text>
      <text x="30" y="160" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">
        • Provide public and private cohort access with join approval queues and unique numerical student ID invites.
      </text>
      <text x="30" y="195" font-family="'Manrope', sans-serif" font-size="13" font-weight="800" fill="#873B46">Expected Outcome: Clean group organization without social chat distraction.</text>
    </g>

    <!-- Objective 3 -->
    <g transform="translate(0, 260)">
      <rect width="830" height="235" rx="22" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1.5" filter="url(#s5_cardShadow)"/>
      <circle cx="50" cy="50" r="22" fill="#873B46"/>
      <text x="50" y="58" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="18" font-weight="900" fill="#FFFCF7">03</text>
      
      <text x="95" y="48" font-family="'Manrope', sans-serif" font-size="20" font-weight="800" fill="#332426">Multi-Version (v1 → v2) Task Submission Engine</text>
      <text x="95" y="72" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#873B46">Goal: Enable progressive student iteration rather than single-shot final grades.</text>
      <line x1="30" y1="95" x2="795" y2="95" stroke="#F0E5D8" stroke-width="1.2"/>

      <text x="30" y="130" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">
        • Implement an 8-stage task lifecycle supporting text derivations, handwritten photos, code links, and PDFs (up to 15MB).
      </text>
      <text x="30" y="160" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">
        • Preserve version histories and changelogs so learners iterate on reviewer feedback rather than restarting from scratch.
      </text>
      <text x="30" y="195" font-family="'Manrope', sans-serif" font-size="13" font-weight="800" fill="#873B46">Expected Outcome: Real-world engineering review experience and mastery over mistakes.</text>
    </g>

    <!-- Objective 4 -->
    <g transform="translate(890, 260)">
      <rect width="830" height="235" rx="22" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1.5" filter="url(#s5_cardShadow)"/>
      <circle cx="50" cy="50" r="22" fill="#873B46"/>
      <text x="50" y="58" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="18" font-weight="900" fill="#FFFCF7">04</text>
      
      <text x="95" y="48" font-family="'Manrope', sans-serif" font-size="20" font-weight="800" fill="#332426">Standardized Rubric Peer Review &amp; Assistive AI</text>
      <text x="95" y="72" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#873B46">Goal: Provide transparent, constructive, multi-dimensional feedback.</text>
      <line x1="30" y1="95" x2="795" y2="95" stroke="#F0E5D8" stroke-width="1.2"/>

      <text x="30" y="130" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">
        • Evaluate submissions across 4 standardized criteria: Correctness, Completeness, Clarity, and Methodology.
      </text>
      <text x="30" y="160" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">
        • Assistive AI service parses student work and highlights missing steps with confidence metrics.
      </text>
      <text x="30" y="195" font-family="'Manrope', sans-serif" font-size="13" font-weight="800" fill="#873B46">Expected Outcome: Clear, actionable feedback with zero arbitrary marks.</text>
    </g>

    <!-- Objective 5 -->
    <g transform="translate(0, 520)">
      <rect width="830" height="235" rx="22" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1.5" filter="url(#s5_cardShadow)"/>
      <circle cx="50" cy="50" r="22" fill="#873B46"/>
      <text x="50" y="58" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="18" font-weight="900" fill="#FFFCF7">05</text>
      
      <text x="95" y="48" font-family="'Manrope', sans-serif" font-size="20" font-weight="800" fill="#332426">Real-Time Doubt Solving &amp; Peer Mentoring</text>
      <text x="95" y="72" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#873B46">Goal: Sub-100ms bidirectional question-and-answer channels.</text>
      <line x1="30" y1="95" x2="795" y2="95" stroke="#F0E5D8" stroke-width="1.2"/>

      <text x="30" y="130" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">
        • Deploy a native WebSocket server for instant message streaming, presence indicators, and diagram uploads.
      </text>
      <text x="30" y="160" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">
        • Author-validated "Accepted Solution" marker rewards peer solvers with +15 XP and pins the winning explanation.
      </text>
      <text x="30" y="195" font-family="'Manrope', sans-serif" font-size="13" font-weight="800" fill="#873B46">Expected Outcome: Active peer assistance with zero page reload friction.</text>
    </g>

    <!-- Objective 6 -->
    <g transform="translate(890, 520)">
      <rect width="830" height="235" rx="22" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1.5" filter="url(#s5_cardShadow)"/>
      <circle cx="50" cy="50" r="22" fill="#873B46"/>
      <text x="50" y="58" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="18" font-weight="900" fill="#FFFCF7">06</text>
      
      <text x="95" y="48" font-family="'Manrope', sans-serif" font-size="20" font-weight="800" fill="#332426">Anti-Exploit Gamification &amp; Reliable Persistence</text>
      <text x="95" y="72" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#873B46">Goal: Auditable consistency tracking and zero data loss on restarts.</text>
      <line x1="30" y1="95" x2="795" y2="95" stroke="#F0E5D8" stroke-width="1.2"/>

      <text x="30" y="130" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">
        • Maintain an auditable, append-only `xp_transactions` ledger preventing point farming and click abuse.
      </text>
      <text x="30" y="160" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">
        • Configure SQLite in WAL mode with auto-checkpoints and client recovery sync to guarantee permanent storage.
      </text>
      <text x="30" y="195" font-family="'Manrope', sans-serif" font-size="13" font-weight="800" fill="#873B46">Expected Outcome: High credibility gamification and 100% data reliability.</text>
    </g>
  </g>

  <!-- Slide Footer -->
  <g transform="translate(100, 990)">
    <line x1="0" y1="0" x2="1720" y2="0" stroke="#E7D8CE" stroke-width="1"/>
    <text x="0" y="32" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#78666A">
      CONSTA PLATFORM • PROJECT OBJECTIVES &amp; DELIVERABLES
    </text>
    <text x="1720" y="32" text-anchor="end" font-family="'Manrope', sans-serif" font-size="13" font-weight="800" fill="#873B46">
      SLIDE 05 / 14
    </text>
  </g>
</svg>
