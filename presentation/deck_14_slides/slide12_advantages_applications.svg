          <text x="35" y="16" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#332426">Zero-Cost Lightweight Deployment</text>
          <text x="35" y="38" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">Self-contained SQLite engine requires no heavy cloud database clusters, making campus intranet hosting frictionless.</text>
        </g>

