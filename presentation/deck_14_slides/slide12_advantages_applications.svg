          <text x="35" y="16" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#332426">Peer-Led Doubt Relief</text>
          <text x="35" y="38" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">High volume repetitive foundational doubts are resolved organically by peers, freeing professors for advanced research.</text>
