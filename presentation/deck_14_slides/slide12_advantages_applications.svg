          <text x="35" y="16" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#332426">Audited Academic Metrics</text>
          <text x="35" y="38" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">Faculty view genuine engagement analytics, daily active study hours, and task revision logs instead of superficial roll-calls.</text>
