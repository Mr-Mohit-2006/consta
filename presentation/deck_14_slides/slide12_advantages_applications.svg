    <text x="0" y="32" font-family="'Manrope', sans-serif" font-size="14" font-weight="600" fill="#78666A">CONSTA Academic Minor Project • Advantages &amp; Real-World Applications</text>
    <text x="1720" y="32" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#873B46" text-anchor="end">Slide 12 of 14</text>
