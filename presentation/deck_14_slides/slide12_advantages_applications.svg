          <text x="12" y="17" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#873B46" text-anchor="middle">04</text>
          <text x="35" y="16" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#332426">Transparent Academic Integrity</text>
          <text x="35" y="38" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">Every assignment submission keeps explicit timestamps and revision diffs, discouraging last-minute plagiarism.</text>
