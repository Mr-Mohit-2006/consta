<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="s10_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF4EB"/>
      <stop offset="60%" stop-color="#F8EFE4"/>
      <stop offset="100%" stop-color="#F0E5D8"/>
    </linearGradient>
    <pattern id="s10_grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#E7D8CE" stroke-width="1" stroke-opacity="0.25"/>
    </pattern>
    <filter id="s10_cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#332426" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#s10_bg)"/>
  <rect width="1920" height="1080" fill="url(#s10_grid)"/>

  <!-- Top Header Ribbon -->
  <g transform="translate(100, 70)">
    <rect width="44" height="44" rx="12" fill="#873B46"/>
    <path d="M 22 14 L 12 20 L 22 26 L 32 20 Z M 16 23 L 16 28 C 16 30 28 30 28 28 L 28 23" fill="none" stroke="#FFFCF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="56" y="22" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#873B46" letter-spacing="2">
      DATABASE &amp; SECURITY ARCHITECTURE
    </text>
    <text x="56" y="44" font-family="'Manrope', sans-serif" font-size="34" font-weight="900" fill="#332426" letter-spacing="-0.5">
      Data Integrity, Concurrency &amp; Cryptographic Protection
    </text>

    <rect x="1560" y="5" width="160" height="36" rx="18" fill="#F4E2E3" stroke="#E7D8CE" stroke-width="1"/>
    <text x="1640" y="28" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#873B46">
      RELIABILITY
    </text>
  </g>

  <line x1="100" y1="155" x2="1820" y2="155" stroke="#E7D8CE" stroke-width="1.5"/>

  <!-- 4 Architecture Cards Grid (2x2) -->
  <g transform="translate(100, 190)">
    <!-- Card 1: SQLite & WAL Mode -->
    <g transform="translate(0, 0)">
      <rect width="830" height="365" rx="24" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1.5" filter="url(#s10_cardShadow)"/>
      <rect x="35" y="35" width="56" height="56" rx="18" fill="#F4E2E3" stroke="#873B46" stroke-width="1.5"/>
      <text x="63" y="70" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="24" font-weight="900" fill="#873B46">🗄</text>

      <text x="110" y="55" font-family="'Manrope', sans-serif" font-size="24" font-weight="800" fill="#332426">SQLite with Write-Ahead Logging (WAL)</text>
      <text x="110" y="80" font-family="'Manrope', sans-serif" font-size="14" font-weight="600" fill="#873B46">Non-Blocking Concurrency &amp; High Throughput</text>
      <line x1="35" y1="110" x2="795" y2="110" stroke="#F0E5D8" stroke-width="1.2"/>

      <text x="35" y="150" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#332426">• PRAGMA journal_mode = WAL</text>
      <text x="35" y="180" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">
        Separates read transactions from write locks. Readers never block writers and writers never block readers, ensuring snappy responses under load.
      </text>

      <text x="35" y="235" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#332426">• Automated Truncation Checkpoints</text>
      <text x="35" y="265" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">
        `PRAGMA wal_checkpoint(TRUNCATE)` is executed on critical writes, preventing uncommitted transaction logs from growing excessively.
      </text>

      <text x="35" y="325" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">
        Eliminates the complexity and resource overhead of heavy standalone database servers.
      </text>
    </g>

    <!-- Card 2: Fail-Safe Backup System -->
    <g transform="translate(890, 0)">
      <rect width="830" height="365" rx="24" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1.5" filter="url(#s10_cardShadow)"/>
      <rect x="35" y="35" width="56" height="56" rx="18" fill="#F4E2E3" stroke="#873B46" stroke-width="1.5"/>
      <text x="63" y="70" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="24" font-weight="900" fill="#873B46">🔄</text>

      <text x="110" y="55" font-family="'Manrope', sans-serif" font-size="24" font-weight="800" fill="#332426">Automated User Backup &amp; Recovery Service</text>
      <text x="110" y="80" font-family="'Manrope', sans-serif" font-size="14" font-weight="600" fill="#873B46">Zero Data Loss Across Cloud Cold Restarts</text>
      <line x1="35" y1="110" x2="795" y2="110" stroke="#F0E5D8" stroke-width="1.2"/>

      <text x="35" y="150" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#332426">• Dual-Layer JSON Fallback Engine</text>
      <text x="35" y="180" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">
        Alongside relational tables, key user accounts, streaks, and passwords are synchronized into an independent JSON fallback backup.
      </text>

      <text x="35" y="235" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#332426">• Client-Side Session Auto-Recovery</text>
      <text x="35" y="265" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">
        If a server instance sleeps or restarts, client credentials dynamically verify and trigger an auto-recovery sync with zero user intervention.
      </text>

      <text x="35" y="325" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">
        Guarantees that student streaks, tasks, and XP history are never lost.
      </text>
    </g>

    <!-- Card 3: Authentication & Cryptography -->
    <g transform="translate(0, 395)">
      <rect width="830" height="365" rx="24" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1.5" filter="url(#s10_cardShadow)"/>
      <rect x="35" y="35" width="56" height="56" rx="18" fill="#F4E2E3" stroke="#873B46" stroke-width="1.5"/>
      <text x="63" y="70" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="24" font-weight="900" fill="#873B46">🔐</text>

      <text x="110" y="55" font-family="'Manrope', sans-serif" font-size="24" font-weight="800" fill="#332426">Authentication &amp; Password Cryptography</text>
      <text x="110" y="80" font-family="'Manrope', sans-serif" font-size="14" font-weight="600" fill="#873B46">JWT Bearer Tokens &amp; bcryptjs Salted Hashing</text>
      <line x1="35" y1="110" x2="795" y2="110" stroke="#F0E5D8" stroke-width="1.2"/>

      <text x="35" y="150" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#332426">• Cryptographic Password Hashing</text>
      <text x="35" y="180" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">
        All user passwords are encrypted using `bcryptjs` with 10 salt rounds before hitting disk storage. Plaintext passwords are never stored.
      </text>

      <text x="35" y="235" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#332426">• Stateless JWT Bearer Header Verification</text>
      <text x="35" y="265" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">
        Incoming requests pass through custom Express authentication middleware that validates token signatures and attaches user context.
      </text>

      <text x="35" y="325" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">
        Protects against session hijacking and unauthorized API invocations.
      </text>
    </g>

    <!-- Card 4: Role-Based Access & Privacy Controls -->
    <g transform="translate(890, 395)">
      <rect width="830" height="365" rx="24" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1.5" filter="url(#s10_cardShadow)"/>
      <rect x="35" y="35" width="56" height="56" rx="18" fill="#F4E2E3" stroke="#873B46" stroke-width="1.5"/>
      <text x="63" y="70" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="24" font-weight="900" fill="#873B46">🛡</text>

      <text x="110" y="55" font-family="'Manrope', sans-serif" font-size="24" font-weight="800" fill="#332426">Role-Based Access &amp; Privacy Controls</text>
      <text x="110" y="80" font-family="'Manrope', sans-serif" font-size="14" font-weight="600" fill="#873B46">Granular Cohort Security &amp; Data Safeguards</text>
      <line x1="35" y1="110" x2="795" y2="110" stroke="#F0E5D8" stroke-width="1.2"/>

      <text x="35" y="150" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#332426">• Creator Admin Governance</text>
      <text x="35" y="180" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">
        Only cohort admins can publish tasks, approve join requests, or remove members. Regular members cannot alter syllabus checklists.
      </text>

      <text x="35" y="235" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#332426">• Public vs. Friends-Only Privacy</text>
      <text x="35" y="265" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#78666A">
        Students control profile visibility. Study streaks and tasks can be restricted to mutual friends, shielding learners from unwanted scrutiny.
      </text>

      <text x="35" y="325" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">
        Maintains academic discipline and a respectful collaborative atmosphere.
      </text>
    </g>
  </g>

  <!-- Slide Footer -->
  <g transform="translate(100, 990)">
    <line x1="0" y1="0" x2="1720" y2="0" stroke="#E7D8CE" stroke-width="1"/>
    <text x="0" y="32" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#78666A">
      CONSTA PLATFORM • DATABASE &amp; SECURITY ARCHITECTURE
    </text>
    <text x="1720" y="32" text-anchor="end" font-family="'Manrope', sans-serif" font-size="13" font-weight="800" fill="#873B46">
      SLIDE 10 / 14
    </text>
  </g>
</svg>
