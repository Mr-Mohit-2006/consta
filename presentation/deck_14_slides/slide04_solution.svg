<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="s4_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF4EB"/>
      <stop offset="60%" stop-color="#F8EFE4"/>
      <stop offset="100%" stop-color="#F0E5D8"/>
    </linearGradient>
    <pattern id="s4_grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#E7D8CE" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
    <filter id="s4_cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#332426" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#s4_bg)"/>
  <rect width="1920" height="1080" fill="url(#s4_grid)"/>

  <!-- Top Header Ribbon -->
  <g transform="translate(100, 70)">
    <rect width="44" height="44" rx="12" fill="#873B46"/>
    <path d="M 22 14 L 12 20 L 22 26 L 32 20 Z M 16 23 L 16 28 C 16 30 28 30 28 28 L 28 23" fill="none" stroke="#FFFCF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="56" y="22" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#873B46" letter-spacing="2">
      PROPOSED SOLUTION
    </text>
    <text x="56" y="44" font-family="'Manrope', sans-serif" font-size="34" font-weight="900" fill="#332426" letter-spacing="-0.5">
      How CONSTA Solves These Academic Problems
    </text>

    <rect x="1560" y="5" width="160" height="36" rx="18" fill="#F4E2E3" stroke="#E7D8CE" stroke-width="1"/>
    <text x="1640" y="28" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#873B46">
      THE SOLUTION
    </text>
  </g>

  <line x1="100" y1="155" x2="1820" y2="155" stroke="#E7D8CE" stroke-width="1.5"/>

  <!-- 4 Solution Pillars (2x2 Grid) -->
  <g transform="translate(100, 190)">
    <!-- Solution Pillar 1 -->
    <g transform="translate(0, 0)">
      <rect width="830" height="365" rx="24" fill="#FFFFFF" stroke="#C58B91" stroke-width="2" filter="url(#s4_cardShadow)"/>
      <circle cx="56" cy="56" r="22" fill="#873B46"/>
      <text x="56" y="64" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="20" font-weight="900" fill="#FFFCF7">✓</text>
      
      <text x="96" y="52" font-family="'Manrope', sans-serif" font-size="22" font-weight="800" fill="#332426">Outcome-Driven Solo Focus Sessions</text>
      <text x="96" y="76" font-family="'Manrope', sans-serif" font-size="14" font-weight="600" fill="#873B46">Decouples Elapsed Time from Learning Proof</text>
      <line x1="35" y1="105" x2="795" y2="105" stroke="#E7D8CE" stroke-width="1.2"/>

      <text x="35" y="145" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#332426">• Verifiable Objective Checklists</text>
      <text x="35" y="175" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Students configure learning goals before starting. Running a timer alone awards zero points. XP is credited only upon confirmed objective completion.
      </text>

      <text x="35" y="235" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#332426">• Roadblock Logger &amp; AI Explainer</text>
      <text x="35" y="265" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Dedicated input logs confusing concepts during study. Pedagogical AI breaks down complex concepts when students hit conceptual walls.
      </text>

      <text x="35" y="325" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">
        Eliminates passive clock-watching and creates authentic self-study habits.
      </text>
    </g>

    <!-- Solution Pillar 2 -->
    <g transform="translate(890, 0)">
      <rect width="830" height="365" rx="24" fill="#FFFFFF" stroke="#C58B91" stroke-width="2" filter="url(#s4_cardShadow)"/>
      <circle cx="56" cy="56" r="22" fill="#873B46"/>
      <text x="56" y="64" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="20" font-weight="900" fill="#FFFCF7">✓</text>
      
      <text x="96" y="52" font-family="'Manrope', sans-serif" font-size="22" font-weight="800" fill="#332426">Governed Study Cohorts &amp; Admin Workspaces</text>
      <text x="96" y="76" font-family="'Manrope', sans-serif" font-size="14" font-weight="600" fill="#873B46">Syllabus-Driven Organization with Role Governance</text>
      <line x1="35" y1="105" x2="795" y2="105" stroke="#E7D8CE" stroke-width="1.2"/>

      <text x="35" y="145" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#332426">• Creator is Designated Admin</text>
      <text x="35" y="175" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Group creators assign tasks with sub-topic checklists, configure deadline timers in days, approve/reject join requests, and moderate membership.
      </text>

      <text x="35" y="235" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#332426">• Unique Group Names &amp; Numerical ID Invites</text>
      <text x="35" y="265" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Enforces clean, unique group names. Students can easily search and add classmates by unique student ID or personal friend network.
      </text>

      <text x="35" y="325" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">
        Zero mixing of social chatter with coursework; deadlines remain crystal clear.
      </text>
    </g>

    <!-- Solution Pillar 3 -->
    <g transform="translate(0, 395)">
      <rect width="830" height="365" rx="24" fill="#FFFFFF" stroke="#C58B91" stroke-width="2" filter="url(#s4_cardShadow)"/>
      <circle cx="56" cy="56" r="22" fill="#873B46"/>
      <text x="56" y="64" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="20" font-weight="900" fill="#FFFCF7">✓</text>
      
      <text x="96" y="52" font-family="'Manrope', sans-serif" font-size="22" font-weight="800" fill="#332426">Multi-Version (v1 → v2) Submissions &amp; Rubrics</text>
      <text x="96" y="76" font-family="'Manrope', sans-serif" font-size="14" font-weight="600" fill="#873B46">8-Stage Task Lifecycle with Progressive Revisions</text>
      <line x1="35" y1="105" x2="795" y2="105" stroke="#E7D8CE" stroke-width="1.2"/>

      <text x="35" y="145" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#332426">• Progressive Revision History</text>
      <text x="35" y="175" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Supports text, handwritten diagrams, code links, and PDFs (up to 15MB). Students upload revised iterations (v1 → v2) with changelogs rather than restarting.
      </text>

      <text x="35" y="235" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#332426">• 4-Criterion Rubric Scorecards</text>
      <text x="35" y="265" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Standardized criteria (Correctness, Completeness, Clarity, Methodology) guide peer reviewers, augmented by assistive AI suggestions.
      </text>

      <text x="35" y="325" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">
        Mirrors professional engineering review cycles; teaches students to learn from mistakes.
      </text>
    </g>

    <!-- Solution Pillar 4 -->
    <g transform="translate(890, 395)">
      <rect width="830" height="365" rx="24" fill="#FFFFFF" stroke="#C58B91" stroke-width="2" filter="url(#s4_cardShadow)"/>
      <circle cx="56" cy="56" r="22" fill="#873B46"/>
      <text x="56" y="64" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="20" font-weight="900" fill="#FFFCF7">✓</text>
      
      <text x="96" y="52" font-family="'Manrope', sans-serif" font-size="22" font-weight="800" fill="#332426">Real-Time Doubt Chat &amp; Auditable Gamification</text>
      <text x="96" y="76" font-family="'Manrope', sans-serif" font-size="14" font-weight="600" fill="#873B46">WebSockets (&lt;100ms) + Accepted Solution Rewards (+15 XP)</text>
      <line x1="35" y1="105" x2="795" y2="105" stroke="#E7D8CE" stroke-width="1.2"/>

      <text x="35" y="145" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#332426">• Zero-Refresh Instant WebSocket Chat</text>
      <text x="35" y="175" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Share notebook snapshots and whiteboard diagrams directly. The question author marks the verified response as the "Accepted Solution" (+15 XP).
      </text>

      <text x="35" y="235" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#332426">• Transparent XP Ledger &amp; Heatmaps</text>
      <text x="35" y="265" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Every XP point is logged in an append-only database table (`xp_transactions`), eliminating click-farming exploits and visualizing real consistency.
      </text>

      <text x="35" y="325" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">
        Incentivizes peer mentoring and maintains authentic academic accountability.
      </text>
    </g>
  </g>

  <!-- Slide Footer -->
  <g transform="translate(100, 990)">
    <line x1="0" y1="0" x2="1720" y2="0" stroke="#E7D8CE" stroke-width="1"/>
    <text x="0" y="32" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#78666A">
      CONSTA PLATFORM • PROPOSED SOLUTION
    </text>
    <text x="1720" y="32" text-anchor="end" font-family="'Manrope', sans-serif" font-size="13" font-weight="800" fill="#873B46">
      SLIDE 04 / 14
    </text>
  </g>
</svg>
