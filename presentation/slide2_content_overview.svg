<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF4EB"/>
      <stop offset="60%" stop-color="#F8EFE4"/>
      <stop offset="100%" stop-color="#F0E5D8"/>
    </linearGradient>

    <linearGradient id="burgundyGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#873B46"/>
      <stop offset="100%" stop-color="#642B35"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFCF7"/>
    </linearGradient>

    <filter id="cardShadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#332426" flood-opacity="0.04"/>
    </filter>

    <pattern id="gridPattern2" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#E7D8CE" stroke-width="1" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bgGrad2)"/>
  <rect width="1920" height="1080" fill="url(#gridPattern2)"/>

  <!-- Top Ambient Glow -->
  <circle cx="1800" cy="80" r="300" fill="#873B46" opacity="0.05" filter="blur(60px)"/>

  <!-- Top Header Ribbon -->
  <g transform="translate(100, 70)">
    <!-- Brand Icon -->
    <rect width="44" height="44" rx="12" fill="url(#burgundyGrad2)"/>
    <path d="M 22 14 L 12 20 L 22 26 L 32 20 Z M 16 23 L 16 28 C 16 30 28 30 28 28 L 28 23" fill="none" stroke="#FFFCF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="56" y="22" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="800" fill="#873B46" letter-spacing="2">
      CONSTA PLATFORM OVERVIEW
    </text>
    <text x="56" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" fill="#332426" letter-spacing="-0.5">
      Key Objectives &amp; System Capabilities
    </text>

    <!-- Top Right Tag -->
    <rect x="1560" y="5" width="160" height="36" rx="18" fill="#F4E2E3" stroke="#E7D8CE" stroke-width="1"/>
    <text x="1640" y="28" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#873B46">
      CORE MODULES
    </text>
  </g>

  <!-- Underline Divider -->
  <line x1="100" y1="155" x2="1820" y2="155" stroke="#E7D8CE" stroke-width="1.5"/>

  <!-- Three Content Cards (Grid Layout) -->
  <g transform="translate(100, 200)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="540" height="690" rx="24" fill="url(#cardGrad2)" stroke="#E7D8CE" stroke-width="1.5" filter="url(#cardShadow2)"/>
      <rect x="35" y="40" width="56" height="56" rx="16" fill="#F4E2E3" stroke="#873B46" stroke-width="1.5"/>
      <circle cx="63" cy="68" r="14" fill="none" stroke="#873B46" stroke-width="2.5"/>
      <polyline points="63,60 63,68 70,68" fill="none" stroke="#873B46" stroke-width="2.5" stroke-linecap="round"/>

      <text x="35" y="145" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#332426">
        01. Outcome-Driven Solo Study
      </text>
      <text x="35" y="180" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="600" fill="#873B46">
        Focus Timer with Verifiable Checklists
      </text>

      <line x1="35" y1="210" x2="505" y2="210" stroke="#F0E5D8" stroke-width="1.5"/>

      <!-- Content Bullet Points -->
      <g transform="translate(35, 250)">
        <circle cx="10" cy="10" r="5" fill="#873B46"/>
        <text x="30" y="16" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="600" fill="#332426">Verifiable Learning Outcomes</text>
        <text x="30" y="42" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#78666A">Time tracking is separated from verified results.</text>

        <circle cx="10" cy="90" r="5" fill="#873B46"/>
        <text x="30" y="96" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="600" fill="#332426">Interactive Objective Checklist</text>
        <text x="30" y="122" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#78666A">Earn XP only when objectives are completed.</text>

        <circle cx="10" cy="170" r="5" fill="#873B46"/>
        <text x="30" y="176" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="600" fill="#332426">Roadblock &amp; Problem Logger</text>
        <text x="30" y="202" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#78666A">Log difficult concepts for peer or AI review.</text>

        <circle cx="10" cy="250" r="5" fill="#873B46"/>
        <text x="30" y="256" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="600" fill="#332426">Pedagogical AI Concept Breakdown</text>
        <text x="30" y="282" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#78666A">Instant contextual clarity on tricky topics.</text>
      </g>
    </g>

    <!-- Card 2 -->
    <g transform="translate(590, 0)">
      <rect width="540" height="690" rx="24" fill="url(#cardGrad2)" stroke="#E7D8CE" stroke-width="1.5" filter="url(#cardShadow2)"/>
      <rect x="35" y="40" width="56" height="56" rx="16" fill="#F4E2E3" stroke="#873B46" stroke-width="1.5"/>
      <path d="M 53 72 A 8 8 0 1 0 53 56 A 8 8 0 1 0 53 72 Z M 73 72 A 6 6 0 1 0 73 60 A 6 6 0 1 0 73 72 Z" fill="none" stroke="#873B46" stroke-width="2.5"/>

      <text x="35" y="145" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#332426">
        02. Collaborative Study Groups
      </text>
      <text x="35" y="180" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="600" fill="#873B46">
        Admin Governance &amp; Cohort Workspaces
      </text>

      <line x1="35" y1="210" x2="505" y2="210" stroke="#F0E5D8" stroke-width="1.5"/>

      <!-- Content Bullet Points -->
      <g transform="translate(35, 250)">
        <circle cx="10" cy="10" r="5" fill="#873B46"/>
        <text x="30" y="16" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="600" fill="#332426">Dedicated Cohort Workspaces</text>
        <text x="30" y="42" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#78666A">Public or private study rooms with join codes.</text>

        <circle cx="10" cy="90" r="5" fill="#873B46"/>
        <text x="30" y="96" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="600" fill="#332426">Admin Group Task Creation</text>
        <text x="30" y="122" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#78666A">Group creators assign structured multi-topic goals.</text>

        <circle cx="10" cy="170" r="5" fill="#873B46"/>
        <text x="30" y="176" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="600" fill="#332426">Real-Time Doubt Chat (WebSockets)</text>
        <text x="30" y="202" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#78666A">Live photo sharing with accepted solution pins.</text>

        <circle cx="10" cy="250" r="5" fill="#873B46"/>
        <text x="30" y="256" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="600" fill="#332426">Friend &amp; ID Direct Search</text>
        <text x="30" y="282" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#78666A">Invite peers instantly by unique username/ID.</text>
      </g>
    </g>

    <!-- Card 3 -->
    <g transform="translate(1180, 0)">
      <rect width="540" height="690" rx="24" fill="url(#cardGrad2)" stroke="#E7D8CE" stroke-width="1.5" filter="url(#cardShadow2)"/>
      <rect x="35" y="40" width="56" height="56" rx="16" fill="#F4E2E3" stroke="#873B46" stroke-width="1.5"/>
      <path d="M 53 52 L 63 42 L 73 52 M 63 45 L 63 75 M 48 78 L 78 78" fill="none" stroke="#873B46" stroke-width="2.5" stroke-linecap="round"/>

      <text x="35" y="145" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#332426">
        03. Revisions &amp; Anti-Exploit XP
      </text>
      <text x="35" y="180" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="600" fill="#873B46">
        Rubric Reviews &amp; Streak Heatmap
      </text>

      <line x1="35" y1="210" x2="505" y2="210" stroke="#F0E5D8" stroke-width="1.5"/>

      <!-- Content Bullet Points -->
      <g transform="translate(35, 250)">
        <circle cx="10" cy="10" r="5" fill="#873B46"/>
        <text x="30" y="16" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="600" fill="#332426">Multi-Version Submissions</text>
        <text x="30" y="42" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#78666A">Preserve v1, v2, v3 iterations with changelog.</text>

        <circle cx="10" cy="90" r="5" fill="#873B46"/>
        <text x="30" y="96" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="600" fill="#332426">Structured Rubric Scorecards</text>
        <text x="30" y="122" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#78666A">Evaluated on correctness, clarity, and reasoning.</text>

        <circle cx="10" cy="170" r="5" fill="#873B46"/>
        <text x="30" y="176" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="600" fill="#332426">Audited XP Ledger</text>
        <text x="30" y="202" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#78666A">Transparent points tracking with spam penalty.</text>

        <circle cx="10" cy="250" r="5" fill="#873B46"/>
        <text x="30" y="256" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="600" fill="#332426">Daily Streak Activity Heatmap</text>
        <text x="30" y="282" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#78666A">Visual consistency metrics &amp; rank progression.</text>
      </g>
    </g>
  </g>

  <!-- Slide Footer -->
  <g transform="translate(100, 990)">
    <line x1="0" y1="0" x2="1720" y2="0" stroke="#E7D8CE" stroke-width="1"/>
    <text x="0" y="32" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#78666A">
      CONSTA PLATFORM • CONFIDENTIAL &amp; PROPRIETARY
    </text>
    <text x="1720" y="32" text-anchor="end" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#873B46">
      SLIDE 02
    </text>
  </g>
</svg>
