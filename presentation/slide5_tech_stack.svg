<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="s5_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF4EB"/>
      <stop offset="60%" stop-color="#F8EFE4"/>
      <stop offset="100%" stop-color="#F0E5D8"/>
    </linearGradient>
    <pattern id="s5_grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#E7D8CE" stroke-width="1" stroke-opacity="0.25"/>
    </pattern>
    <filter id="s5_cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#332426" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#s5_bg)"/>
  <rect width="1920" height="1080" fill="url(#s5_grid)"/>

  <!-- Top Header Ribbon -->
  <g transform="translate(100, 70)">
    <rect width="44" height="44" rx="12" fill="#873B46"/>
    <path d="M 22 14 L 12 20 L 22 26 L 32 20 Z M 16 23 L 16 28 C 16 30 28 30 28 28 L 28 23" fill="none" stroke="#FFFCF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="56" y="22" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#873B46" letter-spacing="2">
      TECHNOLOGY STACK
    </text>
    <text x="56" y="44" font-family="'Manrope', sans-serif" font-size="34" font-weight="900" fill="#332426" letter-spacing="-0.5">
      Modern, Robust &amp; High-Performance Full-Stack Architecture
    </text>

    <rect x="1560" y="5" width="160" height="36" rx="18" fill="#F4E2E3" stroke="#E7D8CE" stroke-width="1"/>
    <text x="1640" y="28" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#873B46">
      TECH STACK
    </text>
  </g>

  <line x1="100" y1="155" x2="1820" y2="155" stroke="#E7D8CE" stroke-width="1.5"/>

  <!-- 4 Categories Grid (2x2) -->
  <g transform="translate(100, 190)">
    <!-- 1. Frontend -->
    <g transform="translate(0, 0)">
      <rect width="830" height="365" rx="24" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1.5" filter="url(#s5_cardShadow)"/>
      <rect x="35" y="35" width="56" height="56" rx="18" fill="#F4E2E3" stroke="#873B46" stroke-width="1.5"/>
      <text x="63" y="70" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="24" font-weight="900" fill="#873B46">⚛</text>

      <text x="110" y="55" font-family="'Manrope', sans-serif" font-size="24" font-weight="800" fill="#332426">Frontend Ecosystem</text>
      <text x="110" y="80" font-family="'Manrope', sans-serif" font-size="14" font-weight="600" fill="#873B46">Responsive, Reactive &amp; Component-Driven</text>
      <line x1="35" y1="110" x2="795" y2="110" stroke="#F0E5D8" stroke-width="1.2"/>

      <!-- Tech Badges -->
      <g transform="translate(35, 130)">
        <rect width="160" height="42" rx="12" fill="#F4E2E3" stroke="#C58B91" stroke-width="1.2"/>
        <text x="80" y="27" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">React 19</text>

        <rect x="175" y="0" width="180" height="42" rx="12" fill="#F4E2E3" stroke="#C58B91" stroke-width="1.2"/>
        <text x="265" y="27" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">Tailwind CSS v4</text>

        <rect x="370" y="0" width="160" height="42" rx="12" fill="#F4E2E3" stroke="#C58B91" stroke-width="1.2"/>
        <text x="450" y="27" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">Vite 8 Bundler</text>

        <rect x="545" y="0" width="170" height="42" rx="12" fill="#F4E2E3" stroke="#C58B91" stroke-width="1.2"/>
        <text x="630" y="27" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">Lucide React</text>
      </g>

      <g transform="translate(35, 205)">
        <text x="0" y="0" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
          • React 19: Modern functional components, custom hooks, and centralized Auth Context.
        </text>
        <text x="0" y="35" font-family="'Manrope', sans-serif" font-size="15" font-weight="400" fill="#78666A">
          • Tailwind CSS v4: Bespoke Cream &amp; Burgundy design tokens with fluid responsiveness.
        </text>
        <text x="0" y="70" font-family="'Manrope', sans-serif" font-size="15" font-weight="400" fill="#78666A">
          • Vite 8 &amp; Lucide: Sub-second hot module replacement and crisp vector SVG iconography.
        </text>
      </g>
    </g>

    <!-- 2. Backend -->
    <g transform="translate(890, 0)">
      <rect width="830" height="365" rx="24" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1.5" filter="url(#s5_cardShadow)"/>
      <rect x="35" y="35" width="56" height="56" rx="18" fill="#F4E2E3" stroke="#873B46" stroke-width="1.5"/>
      <text x="63" y="70" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="24" font-weight="900" fill="#873B46">⚡</text>

      <text x="110" y="55" font-family="'Manrope', sans-serif" font-size="24" font-weight="800" fill="#332426">Backend &amp; Real-Time Layer</text>
      <text x="110" y="80" font-family="'Manrope', sans-serif" font-size="14" font-weight="600" fill="#873B46">RESTful APIs + Bidirectional Streaming</text>
      <line x1="35" y1="110" x2="795" y2="110" stroke="#F0E5D8" stroke-width="1.2"/>

      <!-- Tech Badges -->
      <g transform="translate(35, 130)">
        <rect width="160" height="42" rx="12" fill="#F4E2E3" stroke="#C58B91" stroke-width="1.2"/>
        <text x="80" y="27" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">Node.js 22</text>

        <rect x="175" y="0" width="170" height="42" rx="12" fill="#F4E2E3" stroke="#C58B91" stroke-width="1.2"/>
        <text x="260" y="27" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">Express.js</text>

        <rect x="360" y="0" width="180" height="42" rx="12" fill="#F4E2E3" stroke="#C58B91" stroke-width="1.2"/>
        <text x="450" y="27" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">ws WebSockets</text>

        <rect x="555" y="0" width="160" height="42" rx="12" fill="#F4E2E3" stroke="#C58B91" stroke-width="1.2"/>
        <text x="635" y="27" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">Multer Uploads</text>
      </g>

      <g transform="translate(35, 205)">
        <text x="0" y="0" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
          • Node.js &amp; Express: RESTful endpoints with parameter validation and custom middlewares.
        </text>
        <text x="0" y="35" font-family="'Manrope', sans-serif" font-size="15" font-weight="400" fill="#78666A">
          • ws WebSockets: Real-time broadcast for chat messages, typing events, and active presence.
        </text>
        <text x="0" y="70" font-family="'Manrope', sans-serif" font-size="15" font-weight="400" fill="#78666A">
          • Multer: Multi-file multipart processor handling diagrams, work photos, and PDFs up to 15MB.
        </text>
      </g>
    </g>

    <!-- 3. Database Layer -->
    <g transform="translate(0, 395)">
      <rect width="830" height="365" rx="24" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1.5" filter="url(#s5_cardShadow)"/>
      <rect x="35" y="35" width="56" height="56" rx="18" fill="#F4E2E3" stroke="#873B46" stroke-width="1.5"/>
      <text x="63" y="70" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="24" font-weight="900" fill="#873B46">🗄</text>

      <text x="110" y="55" font-family="'Manrope', sans-serif" font-size="24" font-weight="800" fill="#332426">Database &amp; Persistence</text>
      <text x="110" y="80" font-family="'Manrope', sans-serif" font-size="14" font-weight="600" fill="#873B46">Zero-Loss Local &amp; Server Storage</text>
      <line x1="35" y1="110" x2="795" y2="110" stroke="#F0E5D8" stroke-width="1.2"/>

      <!-- Tech Badges -->
      <g transform="translate(35, 130)">
        <rect width="180" height="42" rx="12" fill="#F4E2E3" stroke="#C58B91" stroke-width="1.2"/>
        <text x="90" y="27" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">node:sqlite</text>

        <rect x="195" y="0" width="180" height="42" rx="12" fill="#F4E2E3" stroke="#C58B91" stroke-width="1.2"/>
        <text x="285" y="27" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">WAL Mode</text>

        <rect x="390" y="0" width="200" height="42" rx="12" fill="#F4E2E3" stroke="#C58B91" stroke-width="1.2"/>
        <text x="490" y="27" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">Auto-Checkpoint</text>

        <rect x="605" y="0" width="180" height="42" rx="12" fill="#F4E2E3" stroke="#C58B91" stroke-width="1.2"/>
        <text x="695" y="27" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">Backup Service</text>
      </g>

      <g transform="translate(35, 205)">
        <text x="0" y="0" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
          • Native Driver: Built-in `node:sqlite` delivering high throughput without binary bloat.
        </text>
        <text x="0" y="35" font-family="'Manrope', sans-serif" font-size="15" font-weight="400" fill="#78666A">
          • WAL Mode: Concurrent non-blocking reads while writing write-ahead transactions.
        </text>
        <text x="0" y="70" font-family="'Manrope', sans-serif" font-size="15" font-weight="400" fill="#78666A">
          • Fail-Safe Persistence: Auto-checkpointing (`TRUNCATE`) + user backup sync prevent data loss.
        </text>
      </g>
    </g>

    <!-- 4. Security & QA Testing -->
    <g transform="translate(890, 395)">
      <rect width="830" height="365" rx="24" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1.5" filter="url(#s5_cardShadow)"/>
      <rect x="35" y="35" width="56" height="56" rx="18" fill="#F4E2E3" stroke="#873B46" stroke-width="1.5"/>
      <text x="63" y="70" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="24" font-weight="900" fill="#873B46">🛡</text>

      <text x="110" y="55" font-family="'Manrope', sans-serif" font-size="24" font-weight="800" fill="#332426">Security &amp; Code Quality</text>
      <text x="110" y="80" font-family="'Manrope', sans-serif" font-size="14" font-weight="600" fill="#873B46">Protected Accounts &amp; Automated Verification</text>
      <line x1="35" y1="110" x2="795" y2="110" stroke="#F0E5D8" stroke-width="1.2"/>

      <!-- Tech Badges -->
      <g transform="translate(35, 130)">
        <rect width="150" height="42" rx="12" fill="#F4E2E3" stroke="#C58B91" stroke-width="1.2"/>
        <text x="75" y="27" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">JWT Auth</text>

        <rect x="165" y="0" width="160" height="42" rx="12" fill="#F4E2E3" stroke="#C58B91" stroke-width="1.2"/>
        <text x="245" y="27" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">bcryptjs</text>

        <rect x="340" y="0" width="190" height="42" rx="12" fill="#F4E2E3" stroke="#C58B91" stroke-width="1.2"/>
        <text x="435" y="27" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">node:test Runner</text>

        <rect x="545" y="0" width="170" height="42" rx="12" fill="#F4E2E3" stroke="#C58B91" stroke-width="1.2"/>
        <text x="630" y="27" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#873B46">Oxlint Linter</text>
      </g>

      <g transform="translate(35, 205)">
        <text x="0" y="0" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
          • JWT &amp; bcryptjs: Salted password hashing (10 rounds) and stateless token authorization.
        </text>
        <text x="0" y="35" font-family="'Manrope', sans-serif" font-size="15" font-weight="400" fill="#78666A">
          • Node.js Test Runner: 33 automated unit, integration, and E2E tests executing continuously.
        </text>
        <text x="0" y="70" font-family="'Manrope', sans-serif" font-size="15" font-weight="400" fill="#78666A">
          • Oxlint: High-speed static analysis ensuring clean, standard-compliant JavaScript.
        </text>
      </g>
    </g>
  </g>

  <!-- Slide Footer -->
  <g transform="translate(100, 990)">
    <line x1="0" y1="0" x2="1720" y2="0" stroke="#E7D8CE" stroke-width="1"/>
    <text x="0" y="32" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#78666A">
      CONSTA PLATFORM • TECHNOLOGY STACK
    </text>
    <text x="1720" y="32" text-anchor="end" font-family="'Manrope', sans-serif" font-size="13" font-weight="800" fill="#873B46">
      SLIDE 05 / 08
    </text>
  </g>
</svg>
