<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF4EB"/>
      <stop offset="50%" stop-color="#F8EFE4"/>
      <stop offset="100%" stop-color="#F0E5D8"/>
    </linearGradient>

    <radialGradient id="ambientBurgundy" cx="90%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#873B46" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#C58B91" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FAF4EB" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientRose" cx="10%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#C58B91" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#FAF4EB" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#873B46"/>
      <stop offset="100%" stop-color="#642B35"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFCF7" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Grid Texture Pattern -->
    <pattern id="gridPattern" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#E7D8CE" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#332426" flood-opacity="0.06"/>
    </filter>

    <filter id="accentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#873B46" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 1. Main Background -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>
  <rect width="1920" height="1080" fill="url(#ambientBurgundy)"/>
  <rect width="1920" height="1080" fill="url(#ambientRose)"/>
  <rect width="1920" height="1080" fill="url(#gridPattern)"/>

  <!-- 2. Decorative Geometric Blobs & Curves -->
  <g opacity="0.85">
    <!-- Top Right Burgundy Flow -->
    <path d="M 1400 0 C 1580 120, 1720 280, 1920 320 L 1920 0 Z" fill="url(#burgundyGrad)" opacity="0.92"/>
    <path d="M 1480 0 C 1620 160, 1750 240, 1920 270 L 1920 0 Z" fill="#C58B91" opacity="0.35"/>

    <!-- Bottom Left Subtle Flow -->
    <path d="M 0 850 C 180 820, 320 920, 480 1080 L 0 1080 Z" fill="#F4E2E3" opacity="0.8"/>
    <path d="M 0 940 C 120 920, 220 980, 320 1080 L 0 1080 Z" fill="#873B46" opacity="0.12"/>
  </g>

  <!-- Decorative Architectural Lines -->
  <circle cx="1650" cy="220" r="180" fill="none" stroke="#FAF4EB" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4"/>
  <circle cx="1650" cy="220" r="240" fill="none" stroke="#FAF4EB" stroke-width="1" opacity="0.2"/>

  <!-- 3. Brand Pill / Top Badge -->
  <g transform="translate(140, 110)">
    <rect width="360" height="52" rx="26" fill="#F4E2E3" stroke="#E7D8CE" stroke-width="1.5"/>
    <!-- Icon Box -->
    <rect x="8" y="7" width="38" height="38" rx="19" fill="url(#burgundyGrad)"/>
    <path d="M 27 19 L 17 25 L 27 31 L 37 25 Z M 21 28 L 21 33 C 21 35 33 35 33 33 L 33 28" fill="none" stroke="#FFFCF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Badge Text -->
    <text x="58" y="32" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="2" fill="#873B46">
      CONSTA PLATFORM DECK
    </text>
  </g>

  <!-- 4. Main Title Section -->
  <g transform="translate(140, 320)">
    <!-- Sub-heading / Category -->
    <text x="0" y="0" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#873B46">
      COLLABORATIVE STUDY &amp; PERSONAL GROWTH
    </text>

    <!-- Main Title -->
    <text x="0" y="110" font-family="'Inter', -apple-system, sans-serif" font-size="92" font-weight="900" letter-spacing="-1.5" fill="#332426">
      CONSTA
    </text>

    <!-- Burgundy Accent Underline Bar -->
    <rect x="0" y="145" width="220" height="8" rx="4" fill="url(#burgundyGrad)"/>
    <rect x="235" y="145" width="30" height="8" rx="4" fill="#C58B91"/>

    <!-- Catchphrase / Pitch -->
    <text x="0" y="210" font-family="'Inter', -apple-system, sans-serif" font-size="32" font-weight="600" fill="#332426">
      The Next-Gen Accountability Ecosystem for Modern Learners
    </text>

    <text x="0" y="265" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="400" fill="#78666A">
      Outcome-Driven Focus • Peer Study Cohorts • Multi-Version Reviews • Real-Time Doubt Solving
    </text>
  </g>

  <!-- 5. Bottom Metadata & Presenter Cards -->
  <g transform="translate(140, 880)">
    <!-- Presenter Card -->
    <rect width="420" height="90" rx="20" fill="url(#cardGrad)" stroke="#E7D8CE" stroke-width="1.5" filter="url(#softShadow)"/>
    <circle cx="45" cy="45" r="24" fill="#F4E2E3" stroke="#873B46" stroke-width="1.5"/>
    <path d="M 45 35 A 8 8 0 1 0 45 51 A 8 8 0 1 0 45 35 Z M 32 58 C 32 53 38 51 45 51 C 52 51 58 53 58 58" fill="none" stroke="#873B46" stroke-width="2.5" stroke-linecap="round"/>
    <text x="85" y="38" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#332426">
      Presented By: Core Engineering Team
    </text>
    <text x="85" y="62" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#78666A">
      Project Showcase &amp; Technical Architecture
    </text>

    <!-- Date / Version Pill -->
    <rect x="1440" y="20" width="200" height="50" rx="14" fill="#F0E5D8" stroke="#E7D8CE" stroke-width="1.5"/>
    <text x="1540" y="52" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#873B46" letter-spacing="1">
      VERSION 2.0 • 2026
    </text>
  </g>
</svg>
