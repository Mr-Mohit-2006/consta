          <circle cx="28" cy="28" r="12" fill="#873B46"/>
          <text x="28" y="33" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="900" fill="#FFFCF7">✓</text>
          <text x="50" y="28" font-family="'Manrope', sans-serif" font-size="16" font-weight="800" fill="#332426">Better Study Management</text>
          <text x="50" y="55" font-family="'Manrope', sans-serif" font-size="13" font-weight="500" fill="#78666A">Combines timers with verifiable outcome checklists and roadblock logs.</text>
        </g>

        <!-- Advantage 2 -->
        <g transform="translate(0, 115)">
          <rect width="480" height="95" rx="14" fill="#FAF4EB" stroke="#E7D8CE" stroke-width="1"/>
          <circle cx="28" cy="28" r="12" fill="#873B46"/>
          <text x="28" y="33" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="900" fill="#FFFCF7">✓</text>
          <text x="50" y="28" font-family="'Manrope', sans-serif" font-size="16" font-weight="800" fill="#332426">Improved Teamwork &amp; Cohorts</text>
          <text x="50" y="55" font-family="'Manrope', sans-serif" font-size="13" font-weight="500" fill="#78666A">Organized workspaces with admin roles, task topics, and deadline timers.</text>
