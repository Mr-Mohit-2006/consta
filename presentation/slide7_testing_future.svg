      <rect x="35" y="35" width="56" height="56" rx="18" fill="#F4E2E3" stroke="#873B46" stroke-width="1.5"/>
      <text x="63" y="70" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="22" font-weight="900" fill="#873B46">🚀</text>

      <text x="105" y="55" font-family="'Manrope', sans-serif" font-size="24" font-weight="800" fill="#332426">Future Scope</text>
      <text x="105" y="80" font-family="'Manrope', sans-serif" font-size="14" font-weight="600" fill="#873B46">Next Phase Evolution Roadmap</text>
      <line x1="35" y1="110" x2="515" y2="110" stroke="#F0E5D8" stroke-width="1.2"/>

      <g transform="translate(35, 140)">
        <!-- Roadmap 1 -->
        <g transform="translate(0, 0)">
          <rect width="480" height="120" rx="16" fill="#FAF4EB" stroke="#E7D8CE" stroke-width="1"/>
          <rect x="20" y="20" width="30" height="30" rx="8" fill="#873B46"/>
          <text x="35" y="40" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="900" fill="#FFFCF7">1</text>
          <text x="60" y="38" font-family="'Manrope', sans-serif" font-size="17" font-weight="800" fill="#332426">Advanced AI Study Assistance</text>
          <text x="20" y="75" font-family="'Manrope', sans-serif" font-size="13" font-weight="500" fill="#78666A">
            Fine-tuned local LLM for automated preliminary rubric evaluations, missing derivation hints, and step-by-step problem breakdowns.
          </text>
        </g>

        <!-- Roadmap 2 -->
        <g transform="translate(0, 145)">
          <rect width="480" height="120" rx="16" fill="#FAF4EB" stroke="#E7D8CE" stroke-width="1"/>
          <rect x="20" y="20" width="30" height="30" rx="8" fill="#873B46"/>
          <text x="35" y="40" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="900" fill="#FFFCF7">2</text>
          <text x="60" y="38" font-family="'Manrope', sans-serif" font-size="17" font-weight="800" fill="#332426">Personalized Recommendations</text>
          <text x="20" y="75" font-family="'Manrope', sans-serif" font-size="13" font-weight="500" fill="#78666A">
            Adaptive study plans that recommend specific revision topics based on historical roadblock frequency and peer review rubrics.
          </text>
        </g>

        <!-- Roadmap 3 -->
        <g transform="translate(0, 290)">
          <rect width="480" height="120" rx="16" fill="#FAF4EB" stroke="#E7D8CE" stroke-width="1"/>
          <rect x="20" y="20" width="30" height="30" rx="8" fill="#873B46"/>
          <text x="35" y="40" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="900" fill="#FFFCF7">3</text>
          <text x="60" y="38" font-family="'Manrope', sans-serif" font-size="17" font-weight="800" fill="#332426">Advanced Study Analytics</text>
          <text x="20" y="75" font-family="'Manrope', sans-serif" font-size="13" font-weight="500" fill="#78666A">
            Cohort velocity charts, peer review latency metrics, and subjective difficulty progression indices for continuous personal growth.
          </text>
        </g>

        <!-- Roadmap 4 -->
        <g transform="translate(0, 435)">
          <rect width="480" height="120" rx="16" fill="#FAF4EB" stroke="#E7D8CE" stroke-width="1"/>
          <rect x="20" y="20" width="30" height="30" rx="8" fill="#873B46"/>
          <text x="35" y="40" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="900" fill="#FFFCF7">4</text>
          <text x="60" y="38" font-family="'Manrope', sans-serif" font-size="17" font-weight="800" fill="#332426">Improved Mobile App Experience</text>
          <text x="20" y="75" font-family="'Manrope', sans-serif" font-size="13" font-weight="500" fill="#78666A">
            Cross-platform React Native mobile client with push notifications, offline session caching, and instant camera diagram uploads.
          </text>
        </g>
      </g>
    </g>
  </g>

  <!-- Slide Footer -->
  <g transform="translate(100, 990)">
    <line x1="0" y1="0" x2="1720" y2="0" stroke="#E7D8CE" stroke-width="1"/>
    <text x="0" y="32" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#78666A">
      CONSTA PLATFORM • TESTING, ADVANTAGES &amp; FUTURE SCOPE
    </text>
    <text x="1720" y="32" text-anchor="end" font-family="'Manrope', sans-serif" font-size="13" font-weight="800" fill="#873B46">
      SLIDE 07 / 08
    </text>
  </g>
</svg>
