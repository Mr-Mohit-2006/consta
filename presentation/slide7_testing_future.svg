          <circle cx="28" cy="28" r="12" fill="#873B46"/>
          <text x="28" y="33" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="900" fill="#FFFCF7">✓</text>
          <text x="50" y="28" font-family="'Manrope', sans-serif" font-size="16" font-weight="800" fill="#332426">Continuous Iteration &amp; Rubrics</text>
          <text x="50" y="55" font-family="'Manrope', sans-serif" font-size="13" font-weight="500" fill="#78666A">Multi-version (v1 → v2) assignment submissions with structured rubrics.</text>
        </g>

        <!-- Advantage 4 -->
        <g transform="translate(0, 345)">
          <rect width="480" height="95" rx="14" fill="#FAF4EB" stroke="#E7D8CE" stroke-width="1"/>
          <circle cx="28" cy="28" r="12" fill="#873B46"/>
          <text x="28" y="33" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="900" fill="#FFFCF7">✓</text>
          <text x="50" y="28" font-family="'Manrope', sans-serif" font-size="16" font-weight="800" fill="#332426">Authentic Progress Tracking</text>
          <text x="50" y="55" font-family="'Manrope', sans-serif" font-size="13" font-weight="500" fill="#78666A">Audited XP ledger and daily streak heatmaps reflect real effort.</text>
        </g>

        <!-- Advantage 5 -->
        <g transform="translate(0, 460)">
          <rect width="480" height="95" rx="14" fill="#FAF4EB" stroke="#E7D8CE" stroke-width="1"/>
          <circle cx="28" cy="28" r="12" fill="#873B46"/>
          <text x="28" y="33" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="900" fill="#FFFCF7">✓</text>
          <text x="50" y="28" font-family="'Manrope', sans-serif" font-size="16" font-weight="800" fill="#332426">Secure User Accounts &amp; Privacy</text>
          <text x="50" y="55" font-family="'Manrope', sans-serif" font-size="13" font-weight="500" fill="#78666A">JWT auth, bcryptjs password hashing, and public/private profile controls.</text>
        </g>
      </g>
    </g>

    <!-- Column 3: Future Scope -->
