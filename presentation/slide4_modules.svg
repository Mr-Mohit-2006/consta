<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="s4_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF4EB"/>
      <stop offset="60%" stop-color="#F8EFE4"/>
      <stop offset="100%" stop-color="#F0E5D8"/>
    </linearGradient>
    <pattern id="s4_grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#E7D8CE" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
    <filter id="s4_cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#332426" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#s4_bg)"/>
  <rect width="1920" height="1080" fill="url(#s4_grid)"/>

  <!-- Top Header Ribbon -->
  <g transform="translate(100, 70)">
    <rect width="44" height="44" rx="12" fill="#873B46"/>
    <path d="M 22 14 L 12 20 L 22 26 L 32 20 Z M 16 23 L 16 28 C 16 30 28 30 28 28 L 28 23" fill="none" stroke="#FFFCF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="56" y="22" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#873B46" letter-spacing="2">
      CORE FEATURES &amp; MODULES
    </text>
    <text x="56" y="44" font-family="'Manrope', sans-serif" font-size="34" font-weight="900" fill="#332426" letter-spacing="-0.5">
      Comprehensive Academic Productivity Suite
    </text>

    <rect x="1560" y="5" width="160" height="36" rx="18" fill="#F4E2E3" stroke="#E7D8CE" stroke-width="1"/>
    <text x="1640" y="28" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#873B46">
      6 CORE MODULES
    </text>
  </g>

  <line x1="100" y1="155" x2="1820" y2="155" stroke="#E7D8CE" stroke-width="1.5"/>

  <!-- 6 Modules Grid (3 Columns x 2 Rows) -->
  <g transform="translate(100, 190)">
    <!-- Module 1: Solo Study Focus -->
    <g transform="translate(0, 0)">
      <rect width="550" height="360" rx="22" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1.5" filter="url(#s4_cardShadow)"/>
      <rect x="30" y="30" width="52" height="52" rx="16" fill="#F4E2E3" stroke="#873B46" stroke-width="1.5"/>
      <!-- Clock & Checklist Icon -->
      <circle cx="56" cy="56" r="14" fill="none" stroke="#873B46" stroke-width="2.5"/>
      <polyline points="56,48 56,56 62,56" fill="none" stroke="#873B46" stroke-width="2.5" stroke-linecap="round"/>

      <text x="95" y="52" font-family="'Manrope', sans-serif" font-size="20" font-weight="800" fill="#332426">1. Solo Study Focus</text>
      <text x="95" y="74" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#873B46">Timer + Outcome Checklists</text>
      <line x1="30" y1="100" x2="520" y2="100" stroke="#F0E5D8" stroke-width="1.2"/>

      <text x="30" y="135" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
        • Configurable Pomodoro Focus Timer
      </text>
      <text x="30" y="165" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Set subjects, goals, and difficulty (Beginner to Expert).
      </text>
      <text x="30" y="205" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
        • Verifiable Learning Objectives
      </text>
      <text x="30" y="235" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        XP is earned only after confirming objective completion.
      </text>
      <text x="30" y="275" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
        • Roadblock Logger &amp; AI Explainer
      </text>
      <text x="30" y="305" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Logs confusing concepts; pedagogical AI clarifies doubts.
      </text>
    </g>

    <!-- Module 2: Collaborative Study Groups -->
    <g transform="translate(585, 0)">
      <rect width="550" height="360" rx="22" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1.5" filter="url(#s4_cardShadow)"/>
      <rect x="30" y="30" width="52" height="52" rx="16" fill="#F4E2E3" stroke="#873B46" stroke-width="1.5"/>
      <!-- Users Icon -->
      <path d="M 48 64 A 8 8 0 1 0 48 48 A 8 8 0 1 0 48 64 Z M 64 64 A 6 6 0 1 0 64 52 A 6 6 0 1 0 64 64 Z" fill="none" stroke="#873B46" stroke-width="2.5"/>

      <text x="95" y="52" font-family="'Manrope', sans-serif" font-size="20" font-weight="800" fill="#332426">2. Collaborative Groups</text>
      <text x="95" y="74" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#873B46">Cohort Hubs &amp; Governance</text>
      <line x1="30" y1="100" x2="520" y2="100" stroke="#F0E5D8" stroke-width="1.2"/>

      <text x="30" y="135" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
        • Dedicated Cohort Rooms &amp; Workspaces
      </text>
      <text x="30" y="165" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Public rooms or private groups with join approval queues.
      </text>
      <text x="30" y="205" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
        • Creator is Designated Admin
      </text>
      <text x="30" y="235" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Admins assign tasks, manage members, and set durations.
      </text>
      <text x="30" y="275" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
        • Unique ID &amp; Friend Invites
      </text>
      <text x="30" y="305" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Search and add classmates by unique numerical student ID.
      </text>
    </g>

    <!-- Module 3: Tasks & Multi-Version Submissions -->
    <g transform="translate(1170, 0)">
      <rect width="550" height="360" rx="22" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1.5" filter="url(#s4_cardShadow)"/>
      <rect x="30" y="30" width="52" height="52" rx="16" fill="#F4E2E3" stroke="#873B46" stroke-width="1.5"/>
      <!-- CheckSquare / Layers Icon -->
      <rect x="42" y="42" width="28" height="28" rx="6" fill="none" stroke="#873B46" stroke-width="2.5"/>
      <path d="M 48 56 L 54 62 L 64 48" fill="none" stroke="#873B46" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="95" y="52" font-family="'Manrope', sans-serif" font-size="20" font-weight="800" fill="#332426">3. Task Management</text>
      <text x="95" y="74" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#873B46">Multi-Version (v1 → v2)</text>
      <line x1="30" y1="100" x2="520" y2="100" stroke="#F0E5D8" stroke-width="1.2"/>

      <text x="30" y="135" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
        • 8-Stage Complete Task Lifecycle
      </text>
      <text x="30" y="165" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        From `not_started` to `submitted`, `revision`, and `completed`.
      </text>
      <text x="30" y="205" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
        • Multi-Format Uploads
      </text>
      <text x="30" y="235" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Handwritten diagram photos, code links, and PDFs (up to 15MB).
      </text>
      <text x="30" y="275" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
        • Revision History &amp; Changelogs
      </text>
      <text x="30" y="305" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Preserves v1, v2 revisions without overwriting earlier work.
      </text>
    </g>

    <!-- Module 4: Peer Reviews and Feedback -->
    <g transform="translate(0, 390)">
      <rect width="550" height="360" rx="22" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1.5" filter="url(#s4_cardShadow)"/>
      <rect x="30" y="30" width="52" height="52" rx="16" fill="#F4E2E3" stroke="#873B46" stroke-width="1.5"/>
      <!-- Award / Feedback Icon -->
      <circle cx="56" cy="50" r="12" fill="none" stroke="#873B46" stroke-width="2.5"/>
      <path d="M 50 60 L 46 72 L 56 68 L 66 72 L 62 60" fill="none" stroke="#873B46" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="95" y="52" font-family="'Manrope', sans-serif" font-size="20" font-weight="800" fill="#332426">4. Peer Reviews &amp; Rubrics</text>
      <text x="95" y="74" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#873B46">Constructive Evaluation</text>
      <line x1="30" y1="100" x2="520" y2="100" stroke="#F0E5D8" stroke-width="1.2"/>

      <text x="30" y="135" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
        • Standardized 4-Criterion Rubric
      </text>
      <text x="30" y="165" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Scored on Correctness, Completeness, Clarity, and Method.
      </text>
      <text x="30" y="205" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
        • Assistive AI Preliminary Assessment
      </text>
      <text x="30" y="235" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Highlights missing derivation steps with confidence scores.
      </text>
      <text x="30" y="275" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
        • Meaningful Peer Feedback
      </text>
      <text x="30" y="305" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Promotes growth mindset; request revisions before approval.
      </text>
    </g>

    <!-- Module 5: Real-Time Doubt-Solving Chat -->
    <g transform="translate(585, 390)">
      <rect width="550" height="360" rx="22" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1.5" filter="url(#s4_cardShadow)"/>
      <rect x="30" y="30" width="52" height="52" rx="16" fill="#F4E2E3" stroke="#873B46" stroke-width="1.5"/>
      <!-- MessageSquare Icon -->
      <path d="M 44 42 L 68 42 C 72 42 74 44 74 48 L 74 62 C 74 66 72 68 68 68 L 54 68 L 44 76 L 44 68 C 40 68 38 66 38 62 L 38 48 C 38 44 40 42 44 42 Z" fill="none" stroke="#873B46" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="95" y="52" font-family="'Manrope', sans-serif" font-size="20" font-weight="800" fill="#332426">5. Real-Time Doubt Chat</text>
      <text x="95" y="74" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#873B46">WebSockets &amp; Photo Q&amp;A</text>
      <line x1="30" y1="100" x2="520" y2="100" stroke="#F0E5D8" stroke-width="1.2"/>

      <text x="30" y="135" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
        • Bidirectional Instant Streaming (&lt;100ms)
      </text>
      <text x="30" y="165" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Zero page refresh; live typing and user presence indicators.
      </text>
      <text x="30" y="205" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
        • Instant Photo &amp; Diagram Uploads
      </text>
      <text x="30" y="235" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Students share whiteboard pictures or notebook snapshots directly.
      </text>
      <text x="30" y="275" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
        • Accepted Solution Badge (+15 XP)
      </text>
      <text x="30" y="305" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Question author awards the verified solver; pins accepted answer.
      </text>
    </g>

    <!-- Module 6: XP Points, Streaks, Leaderboards -->
    <g transform="translate(1170, 390)">
      <rect width="550" height="360" rx="22" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1.5" filter="url(#s4_cardShadow)"/>
      <rect x="30" y="30" width="52" height="52" rx="16" fill="#F4E2E3" stroke="#873B46" stroke-width="1.5"/>
      <!-- Flame / Trophy Icon -->
      <path d="M 56 42 C 50 50 48 54 48 60 A 8 8 0 0 0 64 60 C 64 54 60 50 56 42 Z" fill="none" stroke="#873B46" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="95" y="52" font-family="'Manrope', sans-serif" font-size="20" font-weight="800" fill="#332426">6. XP, Streaks &amp; Ranks</text>
      <text x="95" y="74" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#873B46">Anti-Exploit Gamification</text>
      <line x1="30" y1="100" x2="520" y2="100" stroke="#F0E5D8" stroke-width="1.2"/>

      <text x="30" y="135" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
        • Auditable Transaction Ledger (`xp_transactions`)
      </text>
      <text x="30" y="165" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Every point reward/penalty is logged with source reference IDs.
      </text>
      <text x="30" y="205" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
        • Daily Study Streak Activity Heatmap
      </text>
      <text x="30" y="235" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        GitHub-style heatmap tracking authentic daily study consistency.
      </text>
      <text x="30" y="275" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
        • Tiered Level Progression
      </text>
      <text x="30" y="305" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Titles unlock from Novice Explorer to Master Scholar.
      </text>
    </g>
  </g>

  <!-- Slide Footer -->
  <g transform="translate(100, 990)">
    <line x1="0" y1="0" x2="1720" y2="0" stroke="#E7D8CE" stroke-width="1"/>
    <text x="0" y="32" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#78666A">
      CONSTA PLATFORM • CORE FEATURES &amp; MODULES
    </text>
    <text x="1720" y="32" text-anchor="end" font-family="'Manrope', sans-serif" font-size="13" font-weight="800" fill="#873B46">
      SLIDE 04 / 08
    </text>
  </g>
</svg>
