<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Deep Wine-Burgundy Gradient Background -->
    <linearGradient id="s8_darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#873B46"/>
      <stop offset="50%" stop-color="#732F3A"/>
      <stop offset="100%" stop-color="#55212A"/>
    </linearGradient>

    <radialGradient id="s8_darkGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#C58B91" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#873B46" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#55212A" stop-opacity="0"/>
    </radialGradient>

    <pattern id="s8_gridDark" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFFCF7" stroke-width="1" stroke-opacity="0.06"/>
    </pattern>

    <filter id="s8_shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#s8_darkBg)"/>
  <rect width="1920" height="1080" fill="url(#s8_darkGlow)"/>
  <rect width="1920" height="1080" fill="url(#s8_gridDark)"/>

  <!-- Geometric Accent Rings in Center -->
  <circle cx="960" cy="460" r="380" fill="none" stroke="#FFFCF7" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.15"/>
  <circle cx="960" cy="460" r="500" fill="none" stroke="#C58B91" stroke-width="1" opacity="0.12"/>

  <!-- Top Brand Mark -->
  <g transform="translate(960, 110)" text-anchor="middle">
    <rect x="-30" y="-30" width="60" height="60" rx="18" fill="#FFFCF7" filter="url(#s8_shadow)"/>
    <path d="M 0 -10 L -14 -2 L 0 6 L 14 -2 Z M -8 2 L -8 8 C -8 11 8 11 8 8 L 8 2" fill="none" stroke="#873B46" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="0" y="60" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#F4E2E3" letter-spacing="3.5">
      CONSTA PLATFORM • SUMMARY &amp; CONCLUSION
    </text>
  </g>

  <!-- Key Conclusion Points Card (3 Horizontal Pills) -->
  <g transform="translate(960, 240)" text-anchor="middle">
    <text x="0" y="0" font-family="'Manrope', sans-serif" font-size="44" font-weight="900" fill="#FFFCF7" letter-spacing="-0.5">
      The Complete Collaborative Learning Solution
    </text>

    <!-- 3 Summary Benefit Cards -->
    <g transform="translate(0, 50)">
      <!-- Card 1 -->
      <g transform="translate(-520, 0)">
        <rect x="-230" y="0" width="460" height="150" rx="20" fill="rgba(255,252,247,0.08)" stroke="rgba(255,252,247,0.2)" stroke-width="1.5"/>
        <text x="0" y="42" font-family="'Manrope', sans-serif" font-size="20" font-weight="800" fill="#FFFCF7">Unified Platform</text>
        <text x="0" y="78" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#EAD2D4">Combines personal learning and collaborative</text>
        <text x="0" y="104" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#EAD2D4">group study into one seamless workspace.</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(0, 0)">
        <rect x="-230" y="0" width="460" height="150" rx="20" fill="rgba(255,252,247,0.08)" stroke="rgba(255,252,247,0.2)" stroke-width="1.5"/>
        <text x="0" y="42" font-family="'Manrope', sans-serif" font-size="20" font-weight="800" fill="#FFFCF7">Accountability &amp; Teamwork</text>
        <text x="0" y="78" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#EAD2D4">Encourages daily consistency, peer mentoring,</text>
        <text x="0" y="104" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#EAD2D4">and continuous rubric feedback.</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(520, 0)">
        <rect x="-230" y="0" width="460" height="150" rx="20" fill="rgba(255,252,247,0.08)" stroke="rgba(255,252,247,0.2)" stroke-width="1.5"/>
        <text x="0" y="42" font-family="'Manrope', sans-serif" font-size="20" font-weight="800" fill="#FFFCF7">Outcome-Driven Focus</text>
        <text x="0" y="78" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#EAD2D4">Shifts student attention from passive timers</text>
        <text x="0" y="104" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#EAD2D4">to verifiable academic mastery.</text>
      </g>
    </g>

    <!-- Key Performance Metrics Ribbon -->
    <g transform="translate(0, 260)">
      <g transform="translate(-450, 0)">
        <text x="0" y="0" font-family="'Manrope', sans-serif" font-size="38" font-weight="900" fill="#FFFCF7">33 / 33</text>
        <text x="0" y="28" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#F4E2E3" letter-spacing="1.5">TESTS PASSING</text>
      </g>
      <g transform="translate(-150, 0)">
        <text x="0" y="0" font-family="'Manrope', sans-serif" font-size="38" font-weight="900" fill="#FFFCF7">&lt; 100ms</text>
        <text x="0" y="28" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#F4E2E3" letter-spacing="1.5">WEBSOCKET LATENCY</text>
      </g>
      <g transform="translate(150, 0)">
        <text x="0" y="0" font-family="'Manrope', sans-serif" font-size="38" font-weight="900" fill="#FFFCF7">v1 → v2</text>
        <text x="0" y="28" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#F4E2E3" letter-spacing="1.5">REVISION LIFECYCLE</text>
      </g>
      <g transform="translate(450, 0)">
        <text x="0" y="0" font-family="'Manrope', sans-serif" font-size="38" font-weight="900" fill="#FFFCF7">100%</text>
        <text x="0" y="28" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#F4E2E3" letter-spacing="1.5">AUDITED XP LEDGER</text>
      </g>
    </g>

    <!-- Massive THANK YOU Headline -->
    <g transform="translate(0, 420)">
      <text x="0" y="0" font-family="'Manrope', 'Poppins', sans-serif" font-size="80" font-weight="900" letter-spacing="2" fill="#FFFCF7">
        THANK YOU!
      </text>
      
      <rect x="-160" y="25" width="320" height="48" rx="24" fill="#FFFCF7" filter="url(#s8_shadow)"/>
      <text x="0" y="56" font-family="'Manrope', sans-serif" font-size="18" font-weight="800" fill="#873B46">
        Questions &amp; Answers
      </text>

      <text x="0" y="120" font-family="'Manrope', sans-serif" font-size="16" font-weight="500" fill="#EAD2D4">
        Project Repository: github.com/Mr-Mohit-2006/consta
      </text>
    </g>
  </g>

  <!-- Slide Footer -->
  <g transform="translate(100, 990)">
    <line x1="0" y1="0" x2="1720" y2="0" stroke="rgba(255,252,247,0.18)" stroke-width="1"/>
    <text x="0" y="32" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#EAD2D4">
      CONSTA PLATFORM • B.TECH MINOR PROJECT EVALUATION • 2026
    </text>
    <text x="1720" y="32" text-anchor="end" font-family="'Manrope', sans-serif" font-size="13" font-weight="800" fill="#FFFCF7">
      SLIDE 08 / 08
    </text>
  </g>
</svg>
