<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="s2_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF4EB"/>
      <stop offset="60%" stop-color="#F8EFE4"/>
      <stop offset="100%" stop-color="#F0E5D8"/>
    </linearGradient>
    <pattern id="s2_grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#E7D8CE" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
    <filter id="s2_cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#332426" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#s2_bg)"/>
  <rect width="1920" height="1080" fill="url(#s2_grid)"/>

  <!-- Top Header Ribbon -->
  <g transform="translate(100, 70)">
    <rect width="44" height="44" rx="12" fill="#873B46"/>
    <path d="M 22 14 L 12 20 L 22 26 L 32 20 Z M 16 23 L 16 28 C 16 30 28 30 28 28 L 28 23" fill="none" stroke="#FFFCF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="56" y="22" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#873B46" letter-spacing="2">
      INTRODUCTION &amp; PROBLEM STATEMENT
    </text>
    <text x="56" y="44" font-family="'Manrope', sans-serif" font-size="34" font-weight="900" fill="#332426" letter-spacing="-0.5">
      Why CONSTA is Needed: The Friction in Modern Student Learning
    </text>

    <rect x="1560" y="5" width="160" height="36" rx="18" fill="#F4E2E3" stroke="#E7D8CE" stroke-width="1"/>
    <text x="1640" y="28" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#873B46">
      THE CHALLENGE
    </text>
  </g>

  <line x1="100" y1="155" x2="1820" y2="155" stroke="#E7D8CE" stroke-width="1.5"/>

  <!-- Introduction Overview Banner -->
  <g transform="translate(100, 190)">
    <rect width="1720" height="90" rx="20" fill="#FFFCF7" stroke="#E7D8CE" stroke-width="1.5" filter="url(#s2_cardShadow)"/>
    <rect x="25" y="20" width="50" height="50" rx="15" fill="#F4E2E3" stroke="#873B46" stroke-width="1.5"/>
    <path d="M 50 32 L 38 38 L 50 44 L 62 38 Z M 44 41 L 44 48 C 44 50 56 50 56 48 L 56 41" fill="none" stroke="#873B46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="95" y="44" font-family="'Manrope', sans-serif" font-size="20" font-weight="800" fill="#332426">
      What is CONSTA?
    </text>
    <text x="95" y="70" font-family="'Manrope', sans-serif" font-size="15" font-weight="500" fill="#78666A">
      CONSTA is an all-in-one collaborative learning and personal productivity platform designed to bridge the gap between individual study discipline and interactive peer learning.
    </text>
  </g>

  <!-- 5 Problem Cards (Grid Layout) -->
  <g transform="translate(100, 315)">
    <!-- Problem 1 -->
    <g transform="translate(0, 0)">
      <rect width="550" height="300" rx="22" fill="#FFF8F8" stroke="#EAD2D4" stroke-width="1.5" filter="url(#s2_cardShadow)"/>
      <circle cx="50" cy="50" r="20" fill="#F4E2E3" stroke="#873B46" stroke-width="2"/>
      <text x="50" y="58" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="18" font-weight="900" fill="#873B46">01</text>
      
      <text x="85" y="48" font-family="'Manrope', sans-serif" font-size="20" font-weight="800" fill="#332426">Poor Study Management</text>
      <text x="85" y="72" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#873B46">Passive "Clock-Watching"</text>
      <line x1="30" y1="95" x2="520" y2="95" stroke="#EAD2D4" stroke-width="1.2"/>

      <text x="30" y="130" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
        • Running a timer ≠ Actual Learning.
      </text>
      <text x="30" y="160" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Students run background timers without setting tangible objectives. Roadblocks and tough concepts are forgotten rather than logged and reviewed.
      </text>
    </g>

    <!-- Problem 2 -->
    <g transform="translate(585, 0)">
      <rect width="550" height="300" rx="22" fill="#FFF8F8" stroke="#EAD2D4" stroke-width="1.5" filter="url(#s2_cardShadow)"/>
      <circle cx="50" cy="50" r="20" fill="#F4E2E3" stroke="#873B46" stroke-width="2"/>
      <text x="50" y="58" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="18" font-weight="900" fill="#873B46">02</text>
      
      <text x="85" y="48" font-family="'Manrope', sans-serif" font-size="20" font-weight="800" fill="#332426">Unorganized Group Learning</text>
      <text x="85" y="72" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#873B46">Social Chat App Chaos</text>
      <line x1="30" y1="95" x2="520" y2="95" stroke="#EAD2D4" stroke-width="1.2"/>

      <text x="30" y="130" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
        • WhatsApp &amp; Discord mix chat with study.
      </text>
      <text x="30" y="160" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Coursework, deadlines, and group tasks get buried under casual messages. No group governance, topic checklists, or structured admin control.
      </text>
    </g>

    <!-- Problem 3 -->
    <g transform="translate(1170, 0)">
      <rect width="550" height="300" rx="22" fill="#FFF8F8" stroke="#EAD2D4" stroke-width="1.5" filter="url(#s2_cardShadow)"/>
      <circle cx="50" cy="50" r="20" fill="#F4E2E3" stroke="#873B46" stroke-width="2"/>
      <text x="50" y="58" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="18" font-weight="900" fill="#873B46">03</text>
      
      <text x="85" y="48" font-family="'Manrope', sans-serif" font-size="20" font-weight="800" fill="#332426">Lack of Proper Feedback</text>
      <text x="85" y="72" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#873B46">The One-Way Revision Void</text>
      <line x1="30" y1="95" x2="520" y2="95" stroke="#EAD2D4" stroke-width="1.2"/>

      <text x="30" y="130" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
        • No iteration on mistakes.
      </text>
      <text x="30" y="160" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Students submit work once, receive an arbitrary mark, and never resubmit improved versions (v1 → v2). Clear, transparent rubrics are missing.
      </text>
    </g>

    <!-- Problem 4 -->
    <g transform="translate(100, 330)">
      <rect width="730" height="290" rx="22" fill="#FFF8F8" stroke="#EAD2D4" stroke-width="1.5" filter="url(#s2_cardShadow)"/>
      <circle cx="50" cy="50" r="20" fill="#F4E2E3" stroke="#873B46" stroke-width="2"/>
      <text x="50" y="58" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="18" font-weight="900" fill="#873B46">04</text>
      
      <text x="85" y="48" font-family="'Manrope', sans-serif" font-size="20" font-weight="800" fill="#332426">Difficulty Solving Academic Doubts</text>
      <text x="85" y="72" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#873B46">High Friction in Peer Q&amp;A</text>
      <line x1="30" y1="95" x2="700" y2="95" stroke="#EAD2D4" stroke-width="1.2"/>

      <text x="30" y="130" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
        • Asking questions online requires external image hosts or clunky tools.
      </text>
      <text x="30" y="160" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        Students cannot easily upload diagrams or mark which answer actually solved the problem. High-quality peer contributors are never rewarded.
      </text>
    </g>

    <!-- Problem 5 -->
    <g transform="translate(890, 330)">
      <rect width="730" height="290" rx="22" fill="#FFF8F8" stroke="#EAD2D4" stroke-width="1.5" filter="url(#s2_cardShadow)"/>
      <circle cx="50" cy="50" r="20" fill="#F4E2E3" stroke="#873B46" stroke-width="2"/>
      <text x="50" y="58" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="18" font-weight="900" fill="#873B46">05</text>
      
      <text x="85" y="48" font-family="'Manrope', sans-serif" font-size="20" font-weight="800" fill="#332426">No Reliable Study Progress Tracking</text>
      <text x="85" y="72" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#873B46">Superficial Exploitable Badges</text>
      <line x1="30" y1="95" x2="700" y2="95" stroke="#EAD2D4" stroke-width="1.2"/>

      <text x="30" y="130" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" fill="#332426">
        • Points are easily farmed through auto-clicks without studying.
      </text>
      <text x="30" y="160" font-family="'Manrope', sans-serif" font-size="14" font-weight="400" fill="#78666A">
        No transparent ledger records whether streak points are real. Students lack visual consistency heatmaps to understand their true study patterns.
      </text>
    </g>
  </g>

  <!-- Slide Footer -->
  <g transform="translate(100, 990)">
    <line x1="0" y1="0" x2="1720" y2="0" stroke="#E7D8CE" stroke-width="1"/>
    <text x="0" y="32" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#78666A">
      CONSTA PLATFORM • INTRODUCTION &amp; PROBLEM STATEMENT
    </text>
    <text x="1720" y="32" text-anchor="end" font-family="'Manrope', sans-serif" font-size="13" font-weight="800" fill="#873B46">
      SLIDE 02 / 08
    </text>
  </g>
</svg>
