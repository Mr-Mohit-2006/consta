services:
  - type: web
    name: consta-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: consta_jwt_secret_persistent_key_2026_collaborative_platform_auth
